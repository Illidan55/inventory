<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Modal for displaying a confirmation dialog before deleting an item -->
<div th:fragment="deleteConfirmModal(modalId, modalTitle, messageId, formAction, formInputId)"
     class="modal fade" th:id="${modalId}" tabindex="-1" role="dialog" th:aria-labelledby="${modalId + 'Label'}"
     aria-hidden="true">
  <form th:action="${formAction}" method="POST">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" th:id="${modalId + 'Label'}" th:text="${modalTitle}">Delete Title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="form-group" hidden>
            <label th:for="${formInputId}" class="form-label">Id</label>
            <input required type="text" th:id="${formInputId}" name="id" value="0" class="form-control mb-4 col-4" readonly/>
          </div>
          <input type="hidden" name="pageNumber" value="">
          <input type="hidden" name="pageSize" value="">
          <input type="hidden" name="sortField" value="">
          <input type="hidden" name="sortDirection" value="">
          <input type="hidden" name="keyword" value="">
          <p th:id="${messageId}">Are you sure you want to delete this item?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </form>
</div>
<!-- Modal for displaying add / edit -->
<div th:fragment="formModal(modalId, modalTitle, formAction, formMethod, formBodyFragmentRef)"
     class="modal fade" th:id="${modalId}" tabindex="-1" role="dialog" th:aria-labelledby="${modalId + 'Label'}"
     aria-hidden="true">
  <form th:action="${formAction}" th:method="${formMethod}">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" th:id="${modalId + 'Label'}" th:text="${modalTitle}">Modal Title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="pageNumber" value="">
          <input type="hidden" name="pageSize" value="">
          <input type="hidden" name="sortField" value="">
          <input type="hidden" name="sortDirection" value="">
          <input type="hidden" name="keyword" value="">

          <div th:replace="${formBodyFragmentRef}">Fallback Form Body</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </form>
</div>

</body>
</html>
