<head th:fragment="headContent(pageTitle, pageSpecificScripts)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${@environment.getProperty('homepage.title')} + ' | ' + ${pageTitle}">App Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" ...>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />

    <script src="https://code.jquery.com/jquery-3.7.1.js" ...></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" ...></script>
    <script type="module" src="/js/sort.js"></script> <th:block th:if="${pageSpecificScripts != null}" th:replace="${pageSpecificScripts}"></th:block>
</head>
