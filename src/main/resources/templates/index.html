<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common-head :: headContent(
            pageTitle='Raw Material Inventory',
            pageSpecificScripts=~{:: #page-scripts}
        )}">
</head>
<body>
<th:block id="page-scripts">
    <script type="module" src="/js/inventory-action.js"></script>
</th:block>
<div th:replace="~{fragments/nav :: header}"></div>
<div class="title-container">
    <div class="title-logo">
        <img class="logo" th:src="${@environment.getProperty('homepage.logoPath')}" alt="logo"/>
    </div>
    <div class="title-text">
        <h1 th:text="${@environment.getProperty('homepage.title')}"/>
        <h1>Raw Material Inventory</h1>
    </div>
</div>
<div id="pathData"
     th:data-base-path="@{/}">
</div>
<div id="sortData"
     th:data-page-number="${page?.number != null ? page.number + 1 : '1'}"
     th:data-page-size="${page?.size != null ? page.size : '10'}"
     th:data-keyword="${keyword}"
     th:data-base-path="@{/page}"
     th:data-sort-field="${sortField}"
     th:data-sort-direction="${sortDirection}">
</div>
<main>
    <div class="container my-2">
        <div class="d-flex justify-content-center align-items-center mb-3">
            <div th:replace="~{fragments/search :: searchBar(
                     keyword=${keyword},
                     sortField=${sortField},
                     sortDirection=${sortDirection},
                     pageSize=${page != null ? page.size : pageSize},
                     formActionPath=@{'/page'},
                     clearActionPath=@{'/'},
                     placeholderText='Search Raw Materials...'
                 )}">
            </div>
            <div class="ms-2">
                <button class="btn btn-primary btn-md text-white" data-bs-toggle="modal"
                        data-bs-target="#addItemModal">
                    Add Item
                </button>
            </div>
            <input type="file" id="csvFileInput" accept=".csv">
            <div class="import-button-container ms-2">
                <button id="importCsvButton" class="btn btn-primary btn-md text-white">
                    Import
                </button>
            </div>
        </div>
        <table class="table table-sm table-striped table-responsive table-bordered border-dark">
            <thead class="table-dark">
            <tr>
                <th>
                    <div class="d-flex justify-content-between align-items-center w-100"><span>Name</span>
                        <div class="btn-group sort-btn">
                            <button type="button" class="btn btn-sm btn-light sort-link"
                                    th:data-column="'name'"
                                    th:aria-label="'Sort by Name'">
                                <i class="fas fa-sort"></i>
                            </button>
                        </div>
                    </div>
                </th>
                <th>
                    <div class="d-flex justify-content-between align-items-center w-100"><span>Type</span>
                        <div class="btn-group sort-btn">
                            <button type="button" class="btn btn-sm btn-light sort-link"
                                    th:data-column="'type'"
                                    th:aria-label="'Sort by Type'">
                                <i class="fas fa-sort"></i>
                            </button>
                        </div>
                    </div>
                </th>
                <th>
                    <div class="d-flex justify-content-between align-items-center w-100"><span>Count</span>
                        <div class="btn-group sort-btn">
                            <button type="button" class="btn btn-sm btn-light sort-link"
                                    th:data-column="'count'"
                                    th:aria-label="'Sort by Count'">
                                <i class="fas fa-sort"></i>
                            </button>
                        </div>
                    </div>
                </th>
                <th>
                    <div class="d-flex justify-content-between align-items-center w-100"><span>Cost Per Item</span>
                        <div class="btn-group sort-btn">
                            <button type="button" class="btn btn-sm btn-light sort-link"
                                    th:data-column="'costPerItem'"
                                    th:aria-label="'Sort by Cost Per Item'">
                                <i class="fas fa-sort"></i>
                            </button>
                        </div>
                    </div>
                </th>
                <th class="column col-sm-2 align-top">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.id}" hidden/>
                <td th:text="${item.name}"/>
                <td th:text="${item.type}"/>
                <td th:text="${item.count}"/>
                <td th:text="'$'+ ${#numbers.formatDecimal(item.costPerUnit, 1, 2)}"/>
                <td class="align-middle">
                    <div class="row gx-2">
                        <div class="col">
                            <a th:href="@{/getItem/__${item.id}__}"
                               class="btn btn-warning btn-md text-white btn-edit w-100" data-bs-toggle="modal"
                               data-bs-target="#editItemModal">Edit</a>
                        </div>
                        <div class="col">
                            <a th:href="@{/getItem/__${item.id}__}"
                               class="btn btn-danger btn-md text-white btn-delete w-100"
                               th:attr="data-item-id=${item.id}, data-item-name=${item.name}" data-bs-toggle="modal"
                               data-bs-target="#deleteItemModal">Delete</a>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/pagination :: paginationNav(
             page=${page},  sortField=${sortField},
             sortDirection=${sortDirection},
             keyword=${keyword},
             basePath=@{'/page'} )}">
        </div>
    </div>
</main>
<div th:replace="~{fragments/modals :: formModal(
        modalId='addItemModal',
        modalTitle='Add Item',
        formAction=@{/addItem},
        formMethod='POST',
        formBodyFragmentRef=~{fragments/forms :: itemFormFields(editMode=false)}
     )}">
</div>

<div th:replace="~{fragments/modals :: formModal(
        modalId='editItemModal',
        modalTitle='Edit Item',
        formAction=@{/editItem},
        formMethod='POST',
        formBodyFragmentRef=~{fragments/forms :: itemFormFields(editMode=true)}
     )}">
</div>

<div th:replace="~{fragments/modals :: deleteConfirmModal(
        modalId='deleteItemModal',
        modalTitle='Delete Item',
        messageId='messageDeleteItem',
        formAction=@{/deleteItem},
        formInputId='formIdDeleteItem'
     )}">
</div>
</body>
</html>
